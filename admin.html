<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Admin - Bolinha Lanches</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #121212;
        color: #ffffff;
        margin: 0;
        padding: 20px;
    }

    /* =========================
       BOTÃO DE TELA CHEIA
    ========================= */
    .btn-fullscreen {
        position: fixed;
        top: 15px;
        right: 15px;
        background: rgba(255, 152, 0, 0.2);
        color: #ff9800;
        border: 1px solid #ff9800;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease, background 0.2s ease, transform 0.2s ease;
    }

    /* Aparece ao passar o mouse na região do canto */
    body:hover .btn-fullscreen,
    .btn-fullscreen:hover {
        opacity: 1;
    }

    .btn-fullscreen:hover {
        background: rgba(255, 152, 0, 0.4);
        transform: scale(1.05);
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        background: #1e1e1e;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #ff9800;
        box-shadow: 0 0 15px rgba(255, 152, 0, 0.2);
    }

    h1,
    h2 {
        color: #ff9800;
        text-align: center;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
    }

    h1 {
        margin-top: 0;
    }

    /* =========================
       MÉTRICAS
    ========================= */

    .metrics-grid {
        display: flex;
        justify-content: center;
        margin-bottom: 25px;
    }

    .metric-card {
        background: #2a2a2a;
        padding: 15px 30px;
        border-radius: 6px;
        border-top: 3px solid #ff9800;
        text-align: center;
        min-width: 220px;
    }

    .metric-card h4 {
        margin: 0;
        color: #aaa;
        font-size: 14px;
    }

    .metric-card p {
        margin: 8px 0 0;
        font-size: 28px;
        font-weight: bold;
        color: #ffb74d;
    }

    /* =========================
       CARD DO PEDIDO
    ========================= */

    .pedido-card {
        background: #2a2a2a;
        border-left: 5px solid #ff9800;
        padding: 18px;
        border-radius: 6px;
        margin-bottom: 15px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .pedido-card.pedido-novo {
        animation: destaqueNovo 1.2s ease-in-out;
    }

    @keyframes destaqueNovo {
        0% {
            transform: scale(1);
            box-shadow: 0 0 0 rgba(255, 152, 0, 0);
        }

        50% {
            transform: scale(1.01);
            box-shadow: 0 0 25px rgba(255, 152, 0, 0.8);
        }

        100% {
            transform: scale(1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
    }

    .pedido-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid #444;
        padding-bottom: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }

    .pedido-header h3 {
        margin: 0;
        color: #ffb74d;
        font-size: 20px;
    }

    .pedido-data {
        color: #aaa;
        font-size: 12px;
    }

    /* =========================
       STATUS
    ========================= */

    .badge-status {
        padding: 5px 9px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
    }

    .status-pendente {
        background: #e67e22;
        color: #fff;
    }

    .status-preparo {
        background: #3498db;
        color: #fff;
    }

    .status-pronto {
        background: #27ae60;
        color: #fff;
    }

    /* =========================
       CORPO DO PEDIDO
    ========================= */

    .pedido-body p {
        margin: 9px 0;
        line-height: 1.5;
        font-size: 15px;
    }

    .pedido-body strong {
        color: #ffb74d;
    }

    .cliente-destaque {
        color: #ffffff;
        font-size: 17px;
        font-weight: bold;
    }

    .obs-destaque {
        color: #ff5252;
        font-weight: bold;
    }

    .acrescimo-destaque {
        color: #27ae60;
        font-weight: bold;
    }

    .pizza-meio {
        background: rgba(255, 152, 0, 0.12);
        border: 1px dashed #ff9800;
        color: #ffb74d;
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        font-weight: bold;
    }

    .itens-pedido {
        background: #222222;
        border-radius: 6px;
        padding: 12px;
        margin-top: 10px;
    }

    .item-pedido {
        padding: 8px 0;
        border-bottom: 1px solid #444;
    }

    .item-pedido:last-child {
        border-bottom: none;
    }

    .item-nome {
        color: #ffffff;
        font-weight: bold;
    }

    .item-obs {
        color: #ffb74d;
        font-size: 13px;
        margin-top: 4px;
    }

    .valor-total {
        font-size: 19px;
        color: #ff9800;
        font-weight: bold;
    }

    /* =========================
       AÇÕES
    ========================= */

    .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 15px;
        border-top: 1px solid #444;
        padding-top: 12px;
    }

    .btn {
        border: none;
        padding: 9px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
        transition: opacity 0.2s, transform 0.2s;
    }

    .btn:hover {
        opacity: 0.85;
        transform: translateY(-1px);
    }

    .btn-preparo {
        background: #3498db;
        color: white;
    }

    .btn-pronto {
        background: #27ae60;
        color: white;
    }

    .btn-concluir {
        background: #7f8c8d;
        color: white;
    }

    /* =========================
       ESTADO VAZIO
    ========================= */

    .estado-vazio {
        text-align: center;
        color: #aaa;
        padding: 30px 10px;
        font-size: 15px;
    }

    /* =========================
       NOTIFICAÇÃO
    ========================= */

    .notificacao {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #27ae60;
        color: white;
        padding: 15px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        font-weight: bold;
        z-index: 999;
        display: none;
        max-width: 320px;
    }

    .notificacao.show {
        display: block;
        animation: aparecerNotificacao 0.3s ease;
    }

    @keyframes aparecerNotificacao {
        from {
            opacity: 0;
            transform: translateY(-15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 600px) {
        body {
            padding: 10px;
        }

        .container {
            padding: 14px;
        }

        .pedido-header {
            align-items: flex-start;
        }

        .actions {
            flex-direction: column;
        }

        .btn {
            width: 100%;
        }

        .notificacao {
            left: 10px;
            right: 10px;
            top: 10px;
            max-width: none;
        }
    }
</style>

</head>

<body>

<!-- Botão de Tela Cheia no Canto Superior Direito -->
<button id="btnFullscreen" class="btn-fullscreen" title="Tela Cheia (Fullscreen)">⛶</button>

<div id="notificacao" class="notificacao">
    🔔 Novo pedido recebido!
</div>

<div class="container">

    <h1>🍔 Painel de Administração - Bolinha Lanches</h1>

    <div class="metrics-grid">
        <div class="metric-card">
            <h4>Pedidos Ativos</h4>
            <p id="total-pendentes">0</p>
        </div>
    </div>

    <h2>📋 Pedidos Recebidos em Tempo Real</h2>

    <div id="lista-pedidos">
        <div class="estado-vazio">
            Aguardando novos pedidos...
        </div>
    </div>

</div>

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue,
        update,
        remove
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";

    import {
        getAnalytics
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-analytics.js";


    /*
    ============================================================
    CONFIGURAÇÃO DO FIREBASE (EXATA DO SEU CONSOLE)
    ============================================================
    */

    const firebaseConfig = {
        apiKey: "AIzaSyAYEgCz2kMGnMqVZDPWiMgxgLWjNQMxeqA",
        authDomain: "bolinha-lanches-ae5ad.firebaseapp.com",
        databaseURL: "https://bolinha-lanches-ae5ad-default-rtdb.firebaseio.com",
        projectId: "bolinha-lanches-ae5ad",
        storageBucket: "bolinha-lanches-ae5ad.firebasestorage.app",
        messagingSenderId: "971256696839",
        appId: "1:971256696839:web:a1d0f4888cf75c28b09aa2",
        measurementId: "G-1674758XZN"
    };


    /*
    ============================================================
    INICIALIZA FIREBASE
    ============================================================
    */

    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const analytics = getAnalytics(app);


    /*
    ============================================================
    ELEMENTOS DA PÁGINA
    ============================================================
    */

    const listaPedidosDiv =
        document.getElementById('lista-pedidos');

    const totalPendentesElem =
        document.getElementById('total-pendentes');

    const notificacao =
        document.getElementById('notificacao');

    const btnFullscreen =
        document.getElementById('btnFullscreen');


    /*
    ============================================================
    CONTROLE DE TELA CHEIA
    ============================================================
    */

    btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error("Erro ao tentar entrar em tela cheia:", err);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    });

    // Altera o ícone do botão dependendo do estado da tela cheia
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            btnFullscreen.innerText = '🗗'; // Ícone para sair
            btnFullscreen.title = 'Sair da Tela Cheia';
        } else {
            btnFullscreen.innerText = '⛶'; // Ícone para entrar
            btnFullscreen.title = 'Tela Cheia (Fullscreen)';
        }
    });


    /*
    ============================================================
    ÁUDIO DE NOVO PEDIDO
    ============================================================
    */

    const audioNotificacao = new Audio(
        'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'
    );

    let qtdPedidosAnterior = 0;

    let primeiraLeitura = true;


    /*
    ============================================================
    REFERÊNCIA DOS PEDIDOS
    ============================================================
    */

    const pedidosRef =
        ref(db, 'pedidos');


    /*
    ============================================================
    ESCUTA EM TEMPO REAL
    ============================================================
    */

    onValue(pedidosRef, (snapshot) => {

        const dados = snapshot.val();

        listaPedidosDiv.innerHTML = '';


        /*
        ========================================================
        NENHUM PEDIDO
        ========================================================
        */

        if (!dados) {

            listaPedidosDiv.innerHTML = `
                <div class="estado-vazio">
                    Nenhum pedido pendente no momento.
                </div>
            `;

            totalPendentesElem.innerText = '0';

            qtdPedidosAnterior = 0;

            primeiraLeitura = false;

            return;
        }


        /*
        ========================================================
        IDs DOS PEDIDOS
        ========================================================
        */

        const idsPedidos =
            Object.keys(dados);


        /*
        ========================================================
        NOTIFICAÇÃO DE NOVO PEDIDO
        ========================================================
        */

        if (
            !primeiraLeitura &&
            idsPedidos.length > qtdPedidosAnterior
        ) {

            audioNotificacao.play()
                .catch(() => {
                    console.log(
                        'O navegador bloqueou o áudio.'
                    );
                });

            mostrarNotificacao(
                '🔔 Novo pedido recebido!'
            );
        }


        qtdPedidosAnterior =
            idsPedidos.length;

        primeiraLeitura = false;


        /*
        ========================================================
        ORDENA PEDIDOS DO MAIS RECENTE PARA O MAIS ANTIGO
        ========================================================
        */

        idsPedidos.sort((a, b) => {

            const dataA =
                dados[a]?.data
                    ? new Date(dados[a].data).getTime()
                    : 0;

            const dataB =
                dados[b]?.data
                    ? new Date(dados[b].data).getTime()
                    : 0;

            return dataB - dataA;
        });


        /*
        ========================================================
        RENDERIZA CADA PEDIDO
        ========================================================
        */

        idsPedidos.forEach((idPedido) => {

            const pedido =
                dados[idPedido];


            /*
            ====================================================
            STATUS
            ====================================================
            */

            const status =
                pedido.status || 'Pendente';

            const statusClass =
                getStatusClass(status);


            /*
            ====================================================
            VALOR
            ====================================================
            */

            const valorNumerico =
                parseFloat(pedido.valor) || 0;


            /*
            ====================================================
            DATA
            ====================================================
            */

            let horarioPedido =
                'Recente';

            if (pedido.data) {

                const dataPedido =
                    new Date(pedido.data);

                if (!isNaN(dataPedido.getTime())) {

                    horarioPedido =
                        dataPedido.toLocaleString(
                            'pt-BR',
                            {
                                day: '2-digit',
                                month: '2-digit',
                                year: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            }
                        );
                }
            }


            /*
            ====================================================
            CLIENTE
            ====================================================
            */

            const cliente =
                pedido.cliente ||
                pedido.nome ||
                'Não informado';


            /*
            ====================================================
            ENDEREÇO
            ====================================================
            */

            const endereco =
                pedido.endereco ||
                'Retirada no Balcão';


            /*
            ====================================================
            TIPO DO PEDIDO
            ====================================================
            */

            const tipoPedido =
                pedido.tipo ||
                pedido.tipoPedido ||
                'Não informado';


            /*
            ====================================================
            PAGAMENTO
            ====================================================
            */

            const pagamento =
                pedido.pagamento ||
                pedido.formaPagamento ||
                'A combinar';


            /*
            ====================================================
            TROCO
            ====================================================
            */

            const troco =
                pedido.troco &&
                pedido.troco !== 'Não necessário'
                    ? pedido.troco
                    : null;


            /*
            ====================================================
            CRIA CARD
            ====================================================
            */

            const div =
                document.createElement('div');

            div.className =
                'pedido-card';


            /*
            ====================================================
            ITENS DO PEDIDO
            ====================================================
            */

            let itensHTML = '';


            /*
            Se o index.html enviar um array de itens
            */

            if (Array.isArray(pedido.itens)) {

                pedido.itens.forEach(item => {

                    itensHTML += `
                        <div class="item-pedido">

                            <div class="item-nome">
                                ${escapeHTML(
                                    item.quantidade || 1
                                )}x
                                ${escapeHTML(
                                    item.nome || 'Item'
                                )}
                            </div>

                            ${
                                item.obs
                                ? `
                                <div class="item-obs">
                                    📝 Obs:
                                    ${escapeHTML(item.obs)}
                                </div>
                                `
                                : ''
                            }

                        </div>
                    `;
                });

            }


            /*
            Se o index.html enviar os itens como texto
            */

            else if (pedido.itens) {

                itensHTML = `
                    <div class="item-pedido">
                        <div class="item-nome">
                            ${escapeHTML(
                                String(pedido.itens)
                            )}
                        </div>
                    </div>
                `;
            }


            /*
            ====================================================
            PIZZA MEIO A MEIO
            ====================================================
            */

            let pizzaMeioHTML = '';


            if (pedido.meioAMeio) {

                const meio =
                    pedido.meioAMeio;

                pizzaMeioHTML = `
                    <div class="pizza-meio">
                        🍕 Pizza Meio a Meio:
                        ${escapeHTML(
                            meio.sabor1 || meio.primeiroSabor || ''
                        )}
                        +
                        ${escapeHTML(
                            meio.sabor2 || meio.segundoSabor || ''
                        )}
                    </div>
                `;

            }

            else if (pedido.pizzaMeioAMeio) {

                const meio =
                    pedido.pizzaMeioAMeio;

                pizzaMeioHTML = `
                    <div class="pizza-meio">
                        🍕 Pizza Meio a Meio:
                        ${escapeHTML(
                            meio.sabor1 || ''
                        )}
                        +
                        ${escapeHTML(
                            meio.sabor2 || ''
                        )}
                    </div>
                `;

            }

            else if (
                pedido.sabor1 &&
                pedido.sabor2
            ) {

                pizzaMeioHTML = `
                    <div class="pizza-meio">
                        🍕 Pizza Meio a Meio:
                        ${escapeHTML(
                            pedido.sabor1
                        )}
                        +
                        ${escapeHTML(
                            pedido.sabor2
                        )}
                    </div>
                `;
            }


            /*
            ====================================================
            OBSERVAÇÕES GERAIS
            ====================================================
            */

            const observacao =
                pedido.obs ||
                pedido.observacao ||
                '';


            /*
            ====================================================
            ACRÉSCIMOS
            ====================================================
            */

            const acrescimos =
                pedido.acrescimos ||
                pedido.adicionais ||
                '';


            /*
            ====================================================
            CONTEÚDO DO CARD
            ====================================================
            */

            div.innerHTML = `

                <div class="pedido-header">

                    <div>

                        <h3>
                            🍔 Pedido #${escapeHTML(
                                idPedido.slice(-4)
                            )}
                        </h3>

                        <div class="pedido-data">
                            🕒 ${escapeHTML(
                                horarioPedido
                            )}
                        </div>

                    </div>

                    <span class="badge-status ${statusClass}">
                        ${escapeHTML(status)}
                    </span>

                </div>


                <div class="pedido-body">

                    <p>
                        <strong>👤 Cliente:</strong>

                        <span class="cliente-destaque">
                            ${escapeHTML(cliente)}
                        </span>
                    </p>


                    <p>
                        <strong>📦 Tipo:</strong>
                        ${escapeHTML(tipoPedido)}
                    </p>


                    <p>
                        <strong>📍 Endereço:</strong>
                        ${escapeHTML(endereco)}
                    </p>


                    ${
                        pedido.bairro
                        ? `
                        <p>
                            <strong>🏘️ Bairro:</strong>
                            ${escapeHTML(
                                pedido.bairro
                            )}
                        </p>
                        `
                        : ''
                    }


                    <p>
                        <strong>💳 Pagamento:</strong>
                        ${escapeHTML(pagamento)}

                        ${
                            troco
                            ? `
                            <br>
                            <strong>💵 Troco para:</strong>
                            R$ ${escapeHTML(
                                String(troco)
                            )}
                            `
                            : ''
                        }

                    </p>


                    ${
                        pizzaMeioHTML
                    }


                    ${
                        itensHTML
                        ? `
                        <div class="itens-pedido">

                            <strong>
                                🍽️ Itens do Pedido
                            </strong>

                            ${itensHTML}

                        </div>
                        `
                        : ''
                    }


                    ${
                        acrescimos
                        ? `
                        <p>
                            <strong>
                                ➕ Acréscimos:
                            </strong>

                            <span class="acrescimo-destaque">
                                ${escapeHTML(
                                    String(acrescimos)
                                )}
                            </span>
                        </p>
                        `
                        : ''
                    }


                    ${
                        observacao
                        ? `
                        <p>
                            <strong>
                                📝 Observações:
                            </strong>

                            <span class="obs-destaque">
                                ${escapeHTML(
                                    observacao
                                )}
                            </span>
                        </p>
                        `
                        : ''
                    }


                    <p class="valor-total">

                        💰 Total:
                        R$ ${valorNumerico
                            .toFixed(2)
                            .replace('.', ',')}

                    </p>

                </div>


                <div class="actions">

                    <button
                        type="button"
                        class="btn btn-preparo"
                        onclick="atualizarStatus(
                            '${idPedido}',
                            'Em Preparo'
                        )"
                    >
                        👨‍🍳 Em Preparo
                    </button>


                    <button
                        type="button"
                        class="btn btn-pronto"
                        onclick="atualizarStatus(
                            '${idPedido}',
                            'Pronto / Em Rota'
                        )"
                    >
                        🛵 Pronto / Em Rota
                    </button>


                    <button
                        type="button"
                        class="btn btn-concluir"
                        onclick="finalizarPedido(
                            '${idPedido}'
                        )"
                    >
                        ✅ Concluir / Finalizar
                    </button>

                </div>

            `;


            listaPedidosDiv.appendChild(div);

        });


        /*
        ========================================================
        ATUALIZA CONTADOR
        ========================================================
        */

        totalPendentesElem.innerText =
            idsPedidos.length;

    });


    /*
    ============================================================
    CLASSE DO STATUS
    ============================================================
    */

    function getStatusClass(status) {

        if (status === 'Em Preparo') {

            return 'status-preparo';

        }

        if (status === 'Pronto / Em Rota') {

            return 'status-pronto';

        }

        return 'status-pendente';
    }


    /*
    ============================================================
    ATUALIZAR STATUS
    ============================================================
    */

    window.atualizarStatus =
        async function (
            idPedido,
            novoStatus
        ) {

            try {

                const pedidoRef =
                    ref(
                        db,
                        `pedidos/${idPedido}`
                    );

                await update(
                    pedidoRef,
                    {
                        status: novoStatus
                    }
                );

                mostrarNotificacao(
                    `Pedido atualizado: ${novoStatus}`
                );

            }

            catch (erro) {

                console.error(
                    'Erro ao atualizar pedido:',
                    erro
                );

                alert(
                    'Não foi possível atualizar o status do pedido.'
                );

            }

        };


    /*
    ============================================================
    FINALIZAR PEDIDO
    ============================================================
    */

    window.finalizarPedido =
        async function (
            idPedido
        ) {

            const confirmar =
                confirm(
                    'Deseja marcar este pedido como concluído e removê-lo do painel?'
                );


            if (!confirmar) {

                return;

            }


            try {

                const pedidoRef =
                    ref(
                        db,
                        `pedidos/${idPedido}`
                    );


                await remove(
                    pedidoRef
                );


                mostrarNotificacao(
                    '✅ Pedido concluído com sucesso!'
                );

            }

            catch (erro) {

                console.error(
                    'Erro ao finalizar pedido:',
                    erro
                );

                alert(
                    'Não foi possível finalizar o pedido.'
                );

            }

        };


    /*
    ============================================================
    NOTIFICAÇÃO
    ============================================================
    */

    function mostrarNotificacao(
        mensagem
    ) {

        notificacao.innerText =
            mensagem;

        notificacao.classList.add(
            'show'
        );


        setTimeout(() => {

            notificacao.classList.remove(
                'show'
            );

        }, 4000);

    }


    /*
    ============================================================
    PROTEÇÃO CONTRA HTML INJETADO
    ============================================================
    */

    function escapeHTML(
        valor
    ) {

        if (
            valor === null ||
            valor === undefined
        ) {

            return '';

        }


        return String(valor)
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&#039;'
            );

    }

</script>
